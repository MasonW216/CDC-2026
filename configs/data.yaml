# ---------------------------------------------------------------------------
# Locked data definitions.
#
# These values are the project's canonical scope. Changing any of them
# requires whole-team approval, an updated docs/data_card.md, updated
# validation tests, and a pull request labeled area:data.
#
# Read this file through stormroute.config rather than re-parsing it.
# ---------------------------------------------------------------------------

version: 1

geography:
  state: North Carolina
  state_fips: "37"
  state_abbrev: NC
  # All 100 NC counties. FIPS are strings: leading zeroes are meaningful and
  # must never be parsed as integers.
  expected_county_count: 100
  crs_storage: EPSG:4326     # lat/lon for storage and API payloads
  crs_area: EPSG:5070        # equal-area for distances and spatial joins

period:
  start_year: 2015
  end_year: 2024

prediction_unit:
  entity: county
  window_hours: 6
  # Windows are anchored to 00:00 UTC, giving four windows per day.
  window_anchor_utc: "00:00"
  timezone_storage: UTC

label:
  name: label_flood_event
  # Exactly these three NOAA event types. Nothing else qualifies.
  hazard_event_types:
    - Flood
    - Flash Flood
    - Debris Flow
  # A window is positive when a qualifying event BEGINS in it (build guide
  # §2.1; see docs/adr/0001-county-six-hour-target.md). Windows are half-open,
  # so every event lands in exactly one window, including zero-duration events
  # that begin exactly on a boundary. Event end time is not used.
  rule: onset
  onset_rule: "window_start <= event_begin < window_end"
  positive_meaning: >-
    At least one qualifying event was reported as beginning in this county
    during this window.
  negative_meaning: >-
    No qualifying event was reported. This is not evidence of safe road
    conditions.

geocoding:
  # NOAA codes events by county (CZ_TYPE = C) or by forecast zone
  # (CZ_TYPE = Z). Zone-coded events need a crosswalk; events that cannot be
  # assigned confidently are excluded and counted, never silently dropped.
  county_coded_flag: C
  zone_coded_flag: Z
  zone_to_county_strategy: TODO   # decided in Milestone 2, recorded in the EDA report
  unresolved_geography_policy: exclude_and_count

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  sample: data/sample
  noaa_raw: data/raw/noaa_storm_events
  boundaries_raw: data/raw/census_tiger
  weather_raw: data/raw/weather
  events_table: data/interim/events.parquet
  county_windows_table: data/processed/county_windows.parquet
  data_quality_report: outputs/metrics/data_quality.json

weather:
  # Decided at the Milestone 2 EDA (reports/eda/eda_findings.md): ERA5-Land
  # fetched directly from the Copernicus Climate Data Store, because Open-Meteo's
  # ERA5-Land has no precipitation or wind. ERA5-Land has no gust variable, so
  # gusts come from ERA5 single levels. Wind speed is derived from u10/v10.
  provider: copernicus_cds
  dataset: reanalysis-era5-land
  gust_dataset: reanalysis-era5-single-levels
  cadence_hours: 1
  # Rolling windows computed strictly from hours at or before the prediction
  # timestamp. See src/stormroute/features/rolling_weather.py.
  rolling_precip_hours: [1, 3, 6, 24, 72]
  required_variables:
    - precipitation
    - temperature
    - wind_speed
    - wind_gust
    - soil_moisture_shallow
    - soil_moisture_deep

quality_thresholds:
  max_missing_fraction_per_feature: 0.05
  max_missing_fraction_per_county_year: 0.10
  require_unique_event_ids: true
  require_timezone_aware_timestamps: true

modes:
  # `sample` reads the tracked fixtures in data/sample/ so notebooks and CI run
  # without a download. `full` reads data/raw/. Selected by STORMROUTE_DATA_MODE.
  default: full
  allowed: [full, sample]
