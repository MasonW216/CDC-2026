# ---------------------------------------------------------------------------
# StormRoute — root Python project
#
# This file defines the analysis/modeling package (`stormroute`), the shared
# development toolchain, and the settings for Ruff, Pytest, and Mypy. The API
# service declares its own runtime dependencies in backend/pyproject.toml but
# is developed and tested from this environment.
#
# Dependencies pin a major version. Do not introduce unbounded requirements.
# Resolve and commit uv.lock whenever this file's dependencies change:
#     uv lock
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "stormroute"
version = "0.1.0"
description = "Explainable AI that helps North Carolina travelers compare routes and departure times to reduce flood-hazard exposure."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "StormRoute Team" }]
keywords = ["weather", "flood", "explainable-ai", "geospatial", "social-good"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]

dependencies = [
    # Tabular and numeric core
    "pandas>=2.2,<3",
    # pandas 2.3 predates numpy 2.5, whose timedelta deprecation fires inside
    # pandas itself (e.g. pd.Timedelta(hours=1)). Lift this cap with pandas 3.
    "numpy>=1.26,<2.5",
    "pyarrow>=16,<21",
    # Geospatial
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    # Modeling
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "joblib>=1.4,<2",
    # I/O, configuration, and validation
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    # Figures
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pandas-stubs>=2.2,<3",
    "types-pyyaml>=6.0,<7",
    "pre-commit>=3.8,<5",
    # The API (backend/pyproject.toml) is developed and tested from this
    # environment, so its runtime dependencies are installed here too.
    "fastapi>=0.114,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
]
notebook = [
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<7",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "nbstripout>=0.7,<1",
    "seaborn>=0.13,<1",
    "mapclassify>=2.6,<3",
    "folium>=0.17,<1",
]

[project.urls]
Repository = "https://github.com/OWNER/stormroute"

[tool.hatch.build.targets.wheel]
packages = ["src/stormroute"]

# ---------------------------------------------------------------------------
# Ruff — formatting and linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "backend/src", "scripts", "tests"]
extend-exclude = ["data", "outputs", "artifacts", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle — every module states its responsibility
    "ANN", # annotations
    "PTH", # prefer pathlib over os.path
    "PD",  # pandas-vet
    "RUF",
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # allow typing.Any where genuinely needed
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through names; annotations add noise there.
"tests/**" = ["D103", "D104", "ANN001", "ANN201"]
"backend/tests/**" = ["D103", "D104", "ANN001", "ANN201"]
# Scripts are thin entry points.
"scripts/**" = ["D103"]
# Notebooks are narrated by Markdown cells, not docstrings, and their displayed
# text uses real typography ("2015–2024", "county × window").
"*.ipynb" = ["D", "ANN", "RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "backend/src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: requires the full dataset or a network call; excluded from CI",
    "network: contacts an external service; excluded from CI",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/stormroute", "backend/src/stormroute_api"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "backend/src", "scripts"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# Scientific and geospatial libraries ship incomplete or absent stubs.
module = [
    "geopandas.*",
    "shapely.*",
    "xgboost.*",
    "sklearn.*",
    "matplotlib.*",
    "seaborn.*",
    "mapclassify.*",
    "folium.*",
    "joblib.*",
]
ignore_missing_imports = true
