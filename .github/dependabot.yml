version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:docs", "priority:should"]
    groups:
      python-dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "*-stubs", "types-*"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:frontend", "priority:should"]
    groups:
      frontend-dev-tooling:
        patterns: ["eslint*", "prettier", "vitest", "@testing-library/*", "@types/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels: ["area:docs", "priority:should"]
