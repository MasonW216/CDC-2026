# ---------------------------------------------------------------------------
# Source-of-truth dataset registry.
#
# A dataset that is not listed here may not be used by any script, notebook, or
# service. Fill in `access_date`, `resolved_files`, and `checksum` when the
# download actually runs — they are evidence, not decoration.
#
# TBD means "not yet retrieved". It must not survive into the final release.
# ---------------------------------------------------------------------------

manifest_version: 1
last_updated: "2026-09-26"
geography: North Carolina
period: "2015-2024"

datasets:

  # -------------------------------------------------------------------------
  # 1. Labels
  # -------------------------------------------------------------------------
  - name: noaa_storm_events_details
    required: true
    publisher: NOAA National Centers for Environmental Information (NCEI)
    description: >-
      Reported storm event records. Source of the Flood, Flash Flood, and Debris
      Flow events that define the positive label.
    source_url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
    documentation_url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/Storm-Data-Export-Format.pdf
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geography: United States, filtered to North Carolina downstream
    license: >-
      U.S. Government work, public domain (17 U.S.C. 105). Attribution to NOAA
      NCEI required by convention.
    local_raw_path: data/raw/noaa_storm_events
    expected_file_pattern: "StormEvents_details-ftp_v1.0_d{year}_c*.csv.gz"
    access_date: TBD
    resolved_files: TBD
    checksum: TBD
    pipeline_script: scripts/download_noaa.py
    consumed_by: src/stormroute/data/noaa.py
    notes: >-
      Filenames carry a creation-date suffix (c-date) that changes when NCEI
      re-publishes a year. Record the resolved filename, not just the year, or
      the run is not reproducible.

  - name: noaa_storm_events_locations
    required: false
    publisher: NOAA National Centers for Environmental Information (NCEI)
    description: >-
      Per-event location points. Used only to help assign zone-coded events to a
      county; not used as a model feature.
    source_url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geography: United States
    license: U.S. Government work, public domain
    local_raw_path: data/raw/noaa_storm_events
    expected_file_pattern: "StormEvents_locations-ftp_v1.0_d{year}_c*.csv.gz"
    access_date: TBD
    resolved_files: TBD
    checksum: TBD
    pipeline_script: scripts/download_noaa.py
    consumed_by: src/stormroute/data/geography.py
    notes: Include only if the Milestone 2 geography audit shows it is needed.

  - name: noaa_storm_events_fatalities
    required: false
    publisher: NOAA National Centers for Environmental Information (NCEI)
    description: >-
      One record per storm death, including where it occurred (e.g. Vehicle/Towed
      Trailer). ANALYSIS ONLY: impact statistics and the proposed severity
      weights in docs/adr/0004. Never a model feature.
    source_url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geography: United States
    license: U.S. Government work, public domain
    local_raw_path: data/raw/noaa_storm_events
    expected_file_pattern: "StormEvents_fatalities-ftp_v1.0_d{year}_c*.csv.gz"
    access_date: "2026-09-26"
    resolved_files: TBD
    checksum: TBD
    pipeline_script: scripts/download_noaa.py
    consumed_by: notebooks/01_storm_events_eda.ipynb
    usage_restriction: Outcome data. Must never enter the feature matrix.

  # -------------------------------------------------------------------------
  # 2. Features
  # -------------------------------------------------------------------------
  - name: era5_land_hourly
    required: true
    publisher: Copernicus Climate Change Service (C3S) / ECMWF
    description: >-
      Hourly reanalysis: precipitation, temperature, snow depth, wind, and soil
      moisture. Source of every gridded weather feature.
    source_url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land-timeseries
    documentation_url: https://confluence.ecmwf.int/display/CKB/ERA5-Land
    access_method: >-
      PROPOSED in docs/adr/0005: CDS point time-series API (cdsapi), one request
      per county at the Census Gazetteer internal point (nearest 0.1 deg cell),
      CSV output. Variables 2m_temperature, total_precipitation, snow_depth,
      10m_u_component_of_wind, 10m_v_component_of_wind,
      volumetric_soil_water_level_1.
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geography: 100 NC counties (+ 5 TN counties retrieved, unused unless a TN scenario is added)
    license: >-
      Copernicus Licence. Free to use and redistribute with attribution;
      Copernicus is not liable for downstream use.
    local_raw_path: data/raw/weather
    expected_file_pattern: "era5_land_timeseries/{county_fips}.csv and era5_land_soil/{county_fips}.csv"
    access_date: "2026-09-26"
    resolved_files: 105 + 105 CSVs, 87,672 hourly rows each (2015-01-01T00Z to 2024-12-31T23Z)
    checksum: per-file SHA-256 in data/raw/weather/SHA256SUMS
    pipeline_script: scripts/fetch_weather.py
    consumed_by: src/stormroute/data/weather.py
    notes: >-
      Reanalysis is retrospective and is NOT what a live deployment would see.
      This train-serve boundary is documented in
      docs/adr/0003-reanalysis-live-forecast-boundary.md and must be stated in
      the model card and in the app. Units: t2m K, tp m per hour
      (de-accumulated), sde m, u10/v10 m/s, swvl1 m3/m3. ERA5-Land has no wind
      gust; see era5_single_levels_timeseries. A single point per county is
      not an area average.

  - name: era5_single_levels_timeseries
    required: false
    publisher: Copernicus Climate Change Service (C3S) / ECMWF
    description: >-
      Hourly ERA5 reanalysis at each county point: 10 m wind gust (max in the
      past hour), 2 m dewpoint, and cloud base height. PROPOSED in
      docs/adr/0005 as the wind-gust source and fog signal.
    source_url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels-timeseries
    access_method: >-
      CDS point time-series API (cdsapi), one request per county at the Census
      Gazetteer internal point, CSV. Variables
      10m_wind_gust_since_previous_post_processing, 2m_dewpoint_temperature,
      cloud_base_height.
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geography: 100 NC counties + 5 TN counties (0.25 deg grid)
    license: CC-BY 4.0 (Copernicus); attribution required
    local_raw_path: data/raw/weather/era5_single_levels
    expected_file_pattern: "{county_fips}.csv"
    access_date: "2026-09-26"
    resolved_files: 105 CSVs, 87,672 hourly rows each
    checksum: per-file SHA-256 in data/raw/weather/era5_single_levels/SHA256SUMS
    pipeline_script: scripts/fetch_weather.py
    consumed_by: src/stormroute/data/weather.py
    notes: >-
      Units fg10 m/s, d2m K, cbh m. cbh is blank when there is no cloud; blank
      means clear sky, not missing.

  - name: census_tiger_counties_2024
    required: true
    publisher: U.S. Census Bureau
    description: TIGER/Line county boundaries; the spatial base for every county join.
    source_url: https://www2.census.gov/geo/tiger/TIGER2024/COUNTY/
    vintage: 2024
    geography: United States, filtered to STATEFP = 37
    license: U.S. Government work, public domain
    local_raw_path: data/raw/census_tiger
    expected_file_pattern: "tl_2024_us_county.zip"
    access_date: TBD
    resolved_files: TBD
    checksum: TBD
    pipeline_script: scripts/download_boundaries.py
    consumed_by: src/stormroute/data/geography.py
    notes: Expect exactly 100 North Carolina counties.

  - name: iem_asos
    required: false
    publisher: Iowa Environmental Mesonet (IEM), Iowa State University, from NWS/FAA ASOS
    description: >-
      Hourly airport station observations (routine + special METARs): wind
      gust, peak wind gust, visibility, present-weather codes (FZRA, SN, FG,
      TS), ice accretion, precipitation, temperature. OPTIONAL per
      docs/adr/0005 (measured validation for ERA5 gusts).
    source_url: https://mesonet.agron.iastate.edu/request/download.phtml
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geography: NC_ASOS network
    license: Derived from U.S. Government observations; cite IEM
    local_raw_path: data/raw/weather/asos
    access_date: "2026-09-26 (download in progress)"
    resolved_files: TBD
    checksum: TBD
    pipeline_script: TBD
    consumed_by: src/stormroute/data/weather.py
    notes: M = missing, T = trace (treat as 0). Gusts only reported when gusty.

  - name: iem_vtec_alert_archive
    required: false
    publisher: Iowa Environmental Mesonet (IEM), archive of NWS VTEC products
    description: >-
      Historical watches, warnings, and advisories with polygons and
      issue/expire times. PROPOSED in docs/adr/0007 as the alert-floor source
      for replay scenarios (the live NWS API serves only active alerts).
    source_url: https://mesonet.agron.iastate.edu/request/gis/watchwarn.phtml
    geography: NC (1,856 records) and TN (884 records)
    period: events starting 2024-09-22T00Z to 2024-10-01T00Z
    license: Derived from U.S. Government products; cite IEM
    local_raw_path: data/raw/nws_alerts_archive
    expected_file_pattern: "helene_{nc,tn}.zip"
    access_date: "2026-09-26"
    resolved_files: [helene_nc.zip, helene_tn.zip]
    checksum:
      helene_nc.zip: 04ba02a70d2b66e484b4165a158420810814f5e295d03c5b146f97a7b4877cdc
      helene_tn.zip: 0338a46e78cff7ed034573e2d404c1fa5cbd40beda13ba8bd460c55ff5a04553
    pipeline_script: scripts/cache_demo.py
    consumed_by: src/stormroute/scoring/alerts.py

  - name: census_gazetteer_counties_2023
    required: false
    publisher: U.S. Census Bureau
    description: County internal points (INTPTLAT, INTPTLONG); the weather lookup location per county.
    source_url: https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2023_Gazetteer/2023_Gaz_counties_national.zip
    license: U.S. Government work, public domain
    local_raw_path: data/raw/census_gazetteer
    access_date: "2026-09-26"
    resolved_files: [2023_Gaz_counties_national.zip]
    checksum: 919df59ba90759cce85468c0337e898e4b39c08eaffce86ddd88fa41f1f7f0c8
    pipeline_script: scripts/fetch_weather.py
    consumed_by: src/stormroute/data/weather.py

  - name: nws_zone_county_correlation
    required: false
    publisher: NOAA National Weather Service
    description: >-
      Public forecast zone to county FIPS crosswalk. Candidate input for
