<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">StormRoute</title>
  <rect width="64" height="64" rx="14" fill="#123A5E"/>
  <!-- rain drop: the hazard -->
  <path d="M40 10c0 0-9 10.5-9 16.5a9 9 0 0 0 18 0C49 20.5 40 10 40 10z" fill="#7CC4F2"/>
  <!-- route: origin to destination, bending away from the hazard -->
